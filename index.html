<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe AI</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Tic-Tac-Toe <span>AI</span></h1>
      </header>

      <form class="settings" id="settings">
        <label>
          Board size
          <select name="size" id="size">
            <option value="3">3 × 3</option>
            <option value="4">4 × 4</option>
            <option value="5">5 × 5</option>
            <option value="6">6 × 6</option>
            <option value="7">7 × 7</option>
          </select>
        </label>

        <label>
          In a row to win
          <select name="winLength" id="winLength"></select>
        </label>

        <fieldset>
          <legend>You play</legend>
          <label><input type="radio" name="humanMark" value="X" checked /> X</label>
          <label><input type="radio" name="humanMark" value="O" /> O</label>
        </fieldset>

        <fieldset>
          <legend>First move</legend>
          <label><input type="radio" name="firstPlayer" value="human" checked /> You</label>
          <label><input type="radio" name="firstPlayer" value="ai" /> AI</label>
        </fieldset>

        <label>
          Difficulty
          <select name="difficulty" id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="unbeatable" selected>Unbeatable</option>
          </select>
        </label>

        <button type="submit">New game</button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="board" id="board" role="grid" aria-label="Game board"></div>
    </main>
  </body>
</html>
